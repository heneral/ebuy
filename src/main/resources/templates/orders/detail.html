<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order details | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <a th:href="@{/orders}" class="back-link"><span aria-hidden="true">←</span> Back to your orders</a>
    <div class="d-flex justify-content-between align-items-start mt-4 mb-4">
        <div>
            <p class="eyebrow mb-2">Thanks for shopping with us</p>
            <h1 class="display-6 fw-bold mb-2">Order details</h1>
            <p class="text-secondary mb-0" th:text="${order.orderNumber}">Order number</p>
        </div>
        <span class="badge text-bg-secondary fs-6" th:text="${order.status}">PENDING</span>
    </div>
    <div class="row g-4">
        <section class="col-lg-8">
            <div class="table-responsive surface-card admin-table">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Product</th><th>Unit price</th><th>Quantity</th><th>Subtotal</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.product.name}">Product</td>
                        <td th:text="|$${#numbers.formatDecimal(item.unitPrice, 1, 2)}|">$0.00</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="|$${#numbers.formatDecimal(item.subtotal, 1, 2)}|">$0.00</td>
                    </tr>
                    </tbody>
                    <tfoot><tr><th colspan="3" class="text-end">Total</th>
                        <th th:text="|$${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">$0.00</th></tr></tfoot>
                </table>
            </div>
        </section>
        <aside class="col-lg-4">
            <div class="card summary-card"><div class="card-body">
                <h2 class="h5">Delivery details</h2>
                <p class="mb-1" th:text="${order.recipientName}">Recipient</p>
                <p class="mb-1" th:text="${order.phone}">Phone</p>
                <p class="mb-0 text-secondary" style="white-space: pre-line" th:text="${order.shippingAddress}">Address</p>
            </div></div>
        </aside>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
