<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your orders | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <header class="page-heading">
        <p class="eyebrow mb-2">The good stuff, on its way</p>
        <h1 class="display-6 fw-bold mb-0">Your orders</h1>
    </header>
    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <span class="empty-state-mark" aria-hidden="true">↗</span>
        <h2 class="h4">Your next favorite is out there</h2>
        <p class="text-secondary mb-3">You haven’t placed an order yet.</p>
        <a th:href="@{/products}" class="btn btn-dark">Start exploring</a>
    </div>
    <div class="table-responsive surface-card admin-table" th:unless="${#lists.isEmpty(orders)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderNumber}">Order number</td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                <td th:text="${order.items.size()}">0</td>
                <td th:text="|$${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">$0.00</td>
                <td><span class="badge text-bg-secondary" th:text="${order.status}">PENDING</span></td>
                <td><a th:href="@{/orders/{number}(number=${order.orderNumber})}" class="btn btn-sm btn-outline-dark">Details</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
