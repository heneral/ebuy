<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name + ' | ebuy'}">Product | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <a th:href="@{/products}" class="back-link"><span aria-hidden="true">←</span> Back to the collection</a>
    <div class="row g-5 mt-3 product-detail">
        <div class="col-md-6">
            <div class="detail-image">
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
                <span th:unless="${product.imageUrl}" class="image-placeholder">ebuy</span>
            </div>
        </div>
        <div class="col-md-6 product-info">
            <div class="product-category" th:text="${product.category.name}">Category</div>
            <h1 class="display-6 fw-bold mt-2" th:text="${product.name}">Product</h1>
            <p class="product-detail-price" th:text="|$${#numbers.formatDecimal(product.price, 1, 2)}|">$0.00</p>
            <hr class="product-divider">
            <p class="product-detail-description" style="white-space: pre-line" th:text="${product.description}">Description</p>
            <p th:if="${product.stockQuantity > 0}" class="stock-label is-in-stock"
               th:text="|${product.stockQuantity} in stock|">In stock</p>
            <p th:unless="${product.stockQuantity > 0}" class="stock-label is-sold-out">Currently out of stock</p>
            <form th:if="${product.stockQuantity > 0}" th:action="@{/cart/add/{id}(id=${product.id})}"
                  method="post" class="purchase-form mt-4">
                <div class="quantity-field">
                    <label class="form-label" for="quantity">Quantity</label>
                    <input id="quantity" class="form-control" type="number" name="quantity" value="1" min="1"
                           th:max="${product.stockQuantity}" required>
                </div>
                <button class="btn btn-dark btn-lg"><span aria-hidden="true">＋</span> Add to cart</button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
