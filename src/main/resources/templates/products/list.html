<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <header class="page-heading">
        <p class="eyebrow mb-2">Find your next favorite</p>
        <h1 class="display-6 fw-bold mb-2">The collection</h1>
        <p class="text-secondary mb-0">Useful, considered pieces for home and everyday.</p>
    </header>
    <form class="catalog-filters row g-3 align-items-end mb-4" method="get" th:action="@{/products}">
        <div class="col-md-6">
            <label class="visually-hidden" for="q">Search products</label>
            <input id="q" class="form-control" type="search" name="q" placeholder="Search by product name..."
                   th:value="${search}">
        </div>
        <div class="col-md-4">
            <label class="visually-hidden" for="category">Category</label>
            <select id="category" class="form-select" name="category">
                <option value="">All categories</option>
                <option th:each="category : ${categories}" th:value="${category.id}"
                        th:selected="${selectedCategory == category.id}" th:text="${category.name}">Category</option>
            </select>
        </div>
        <div class="col-md-2 d-grid"><button class="btn btn-dark">Find products</button></div>
    </form>
    <p class="catalog-count" th:if="${products.totalElements > 0}" th:text="|${products.totalElements} items to explore|">Items to explore</p>
    <div class="empty-state" th:if="${products.totalElements == 0}">
        <span class="empty-state-mark" aria-hidden="true">⌕</span>
        <h2 class="h4">Nothing found just yet</h2>
        <p class="text-secondary mb-3">Try a different search or browse the full collection.</p>
        <a class="btn btn-outline-brand" th:href="@{/products}">Clear filters</a>
    </div>
    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="product : ${products.content}">
            <article class="card product-card h-100">
                <a th:href="@{/products/{id}(id=${product.id})}" class="product-image">
                    <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
                    <span th:unless="${product.imageUrl}" class="image-placeholder">ebuy</span>
                </a>
                <div class="card-body d-flex flex-column">
                    <div class="product-category" th:text="${product.category.name}">Category</div>
                    <h2 class="h5 mt-1"><a class="text-decoration-none text-dark"
                        th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></h2>
                    <p class="product-description" th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="product-price" th:text="|$${#numbers.formatDecimal(product.price, 1, 2)}|">$0.00</span>
                        <span class="stock-label" th:classappend="${product.stockQuantity > 0 ? ' is-in-stock' : ' is-sold-out'}"
                              th:text="${product.stockQuantity > 0 ? 'In stock' : 'Sold out'}">In stock</span>
                    </div>
                </div>
            </article>
        </div>
    </div>
    <nav th:if="${products.totalPages > 1}" class="mt-5" aria-label="Product pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products(page=${products.number - 1}, q=${search}, category=${selectedCategory})}">Previous</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${p == products.number} ? 'active'">
                <a class="page-link" th:href="@{/products(page=${p}, q=${search}, category=${selectedCategory})}"
                   th:text="${p + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products(page=${products.number + 1}, q=${search}, category=${selectedCategory})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
