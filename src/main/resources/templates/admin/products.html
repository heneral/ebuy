<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage products | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <header class="page-heading page-heading-row">
        <div>
            <p class="eyebrow mb-2">Store workspace</p>
            <h1 class="display-6 fw-bold mb-0">Products</h1>
        </div>
        <a th:href="@{/admin/products/new}" class="btn btn-dark">Add product</a>
    </header>
    <div class="table-responsive surface-card admin-table">
        <table class="table align-middle mb-0">
            <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Visibility</th><th></th></tr></thead>
            <tbody>
            <tr th:each="product : ${products.content}">
                <td th:text="${product.name}">Product</td>
                <td th:text="${product.category.name}">Category</td>
                <td th:text="|$${#numbers.formatDecimal(product.price, 1, 2)}|">$0.00</td>
                <td th:text="${product.stockQuantity}">0</td>
                <td th:text="${product.active ? 'Active' : 'Hidden'}">Active</td>
                <td class="text-end text-nowrap">
                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-outline-dark">Edit</a>
                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                onclick="return confirm('Delete this product?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${products.totalPages > 1}" aria-label="Admin product pages">
        <ul class="pagination">
            <li class="page-item" th:each="p : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${p == products.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/products(page=${p})}" th:text="${p + 1}">1</a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
