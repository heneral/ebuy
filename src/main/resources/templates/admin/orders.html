<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage orders | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <header class="page-heading">
        <p class="eyebrow mb-2">Store workspace</p>
        <h1 class="display-6 fw-bold mb-0">Orders</h1>
    </header>
    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <h2 class="h4">No orders yet</h2>
        <p class="text-secondary mb-0">New customer orders will show up here.</p>
    </div>
    <div class="table-responsive surface-card admin-table" th:unless="${#lists.isEmpty(orders)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Update</th></tr></thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td>
                    <a class="link-dark" th:href="@{/orders/{number}(number=${order.orderNumber})}"
                       th:text="${order.orderNumber}">Order</a>
                </td>
                <td><span th:text="${order.user.fullName}">Customer</span><br>
                    <span class="small text-secondary" th:text="${order.user.email}">email</span></td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                <td th:text="|$${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">$0.00</td>
                <td><span class="badge text-bg-secondary" th:text="${order.status}">PENDING</span></td>
                <td>
                    <form th:if="${order.status.name() == 'PENDING' || order.status.name() == 'PROCESSING' || order.status.name() == 'SHIPPED'}"
                          th:action="@{/admin/orders/{number}/status(number=${order.orderNumber})}"
                          method="post" class="d-flex gap-1">
                        <select name="status" class="form-select form-select-sm" aria-label="New order status">
                            <option th:if="${order.status.name() == 'PENDING'}" value="PROCESSING">Processing</option>
                            <option th:if="${order.status.name() == 'PENDING' || order.status.name() == 'PROCESSING'}"
                                    value="CANCELLED">Cancelled</option>
                            <option th:if="${order.status.name() == 'PROCESSING'}" value="SHIPPED">Shipped</option>
                            <option th:if="${order.status.name() == 'SHIPPED'}" value="DELIVERED">Delivered</option>
                        </select>
                        <button class="btn btn-sm btn-dark">Save</button>
                    </form>
                    <span th:if="${order.status.name() == 'DELIVERED' || order.status.name() == 'CANCELLED'}"
                          class="small text-secondary">Final</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
