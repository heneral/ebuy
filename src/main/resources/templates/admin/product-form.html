<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <a th:href="@{/admin/products}" class="back-link"><span aria-hidden="true">←</span> Back to products</a>
    <div class="form-card admin-form-card mt-4">
        <p class="eyebrow mb-2">Store workspace</p>
        <h1 class="h2 mb-4" th:text="${productForm.id == null ? 'Add a product' : 'Edit product'}">Product</h1>
        <form th:action="@{/admin/products}" th:object="${productForm}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input id="name" class="form-control" th:field="*{name}" required maxlength="120">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" class="form-control" rows="4" th:field="*{description}"
                          required maxlength="3000"></textarea>
                <div class="text-danger small" th:errors="*{description}"></div>
            </div>
            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="price">Price</label>
                    <input id="price" class="form-control" type="number" step="0.01" min="0.01"
                           th:field="*{price}" required>
                    <div class="text-danger small" th:errors="*{price}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="stockQuantity">Stock quantity</label>
                    <input id="stockQuantity" class="form-control" type="number" min="0"
                           th:field="*{stockQuantity}" required>
                    <div class="text-danger small" th:errors="*{stockQuantity}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="categoryId">Category</label>
                    <select id="categoryId" class="form-select" th:field="*{categoryId}" required>
                        <option value="">Choose...</option>
                        <option th:each="category : ${categories}" th:value="${category.id}"
                                th:text="${category.name}">Category</option>
                    </select>
                    <div class="text-danger small" th:errors="*{categoryId}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="imageUrl">Image URL (optional)</label>
                <input id="imageUrl" class="form-control" type="url" th:field="*{imageUrl}" maxlength="1000">
                <div class="text-danger small" th:errors="*{imageUrl}"></div>
            </div>
            <div class="form-check mb-4">
                <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                <label class="form-check-label" for="active">Visible in the public catalog</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark">Save product</button>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
