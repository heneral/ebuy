<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell auth-shell">
    <div class="form-card auth-card mx-auto">
        <div class="auth-mark" aria-hidden="true">e</div>
        <p class="eyebrow text-center mb-2">Welcome back</p>
        <h1 class="h2 mb-2 text-center">Sign in</h1>
        <p class="text-secondary text-center mb-4">Pick up where you left off.</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-info">You have been signed out.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-dark w-100">Sign in</button>
        </form>
        <p class="auth-switch mt-4 mb-0 text-center">New to ebuy? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
