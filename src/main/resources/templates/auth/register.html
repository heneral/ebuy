<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell auth-shell">
    <div class="form-card auth-card mx-auto">
        <div class="auth-mark" aria-hidden="true">e</div>
        <p class="eyebrow text-center mb-2">Make yourself at home</p>
        <h1 class="h2 mb-2 text-center">Create your account</h1>
        <p class="text-secondary text-center mb-4">A few details and you’re ready to go.</p>
        <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>
        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <div class="mb-3">
                <label class="form-label" for="fullName">Full name</label>
                <input id="fullName" class="form-control" th:field="*{fullName}" required maxlength="100">
                <div class="text-danger small" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" th:field="*{username}" required minlength="3" maxlength="50"
                       autocomplete="username">
                <div class="text-danger small" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" class="form-control" th:field="*{email}" required maxlength="254">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" class="form-control" th:field="*{password}"
                       minlength="8" maxlength="72" required autocomplete="new-password">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}"
                       required autocomplete="new-password">
                <div class="text-danger small" th:errors="*{confirmPassword}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone (optional)</label>
                <input id="phone" class="form-control" th:field="*{phone}" maxlength="30">
                <div class="text-danger small" th:errors="*{phone}"></div>
            </div>
            <button class="btn btn-dark w-100 mt-2">Create account</button>
        </form>
        <p class="auth-switch mt-4 mb-0 text-center">Already a member? <a th:href="@{/login}">Sign in</a></p>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
