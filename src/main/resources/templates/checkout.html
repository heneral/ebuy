<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | ebuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <header class="page-heading">
        <p class="eyebrow mb-2">One last step</p>
        <h1 class="display-6 fw-bold mb-2">Delivery details</h1>
        <p class="text-secondary mb-0">Where should we send your order?</p>
    </header>
    <div th:if="${checkoutError}" class="alert alert-warning" th:text="${checkoutError}"></div>
    <div class="row g-5">
        <div class="col-lg-7">
            <section class="surface-card checkout-form-card">
                <h2 class="h5 mb-4">Your information</h2>
            <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Recipient name</label>
                    <input id="fullName" class="form-control" th:field="*{fullName}" required maxlength="100">
                    <div class="text-danger small" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone</label>
                    <input id="phone" class="form-control" th:field="*{phone}" required maxlength="30">
                    <div class="text-danger small" th:errors="*{phone}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="shippingAddress">Shipping address</label>
                    <textarea id="shippingAddress" class="form-control" rows="4" th:field="*{shippingAddress}"
                              required maxlength="500"></textarea>
                    <div class="text-danger small" th:errors="*{shippingAddress}"></div>
                </div>
                <button class="btn btn-dark btn-lg mt-2">Place your order <span aria-hidden="true">→</span></button>
            </form>
            </section>
        </div>
        <aside class="col-lg-5">
            <div class="card summary-card">
                <div class="card-body">
                    <p class="eyebrow mb-2">A good choice</p>
                    <h2 class="h5 mb-3">Order summary</h2>
                    <div th:each="line : ${lines}" class="d-flex justify-content-between py-2 border-bottom">
                        <span th:text="|${line.product.name} × ${line.quantity}|">Item</span>
                        <span th:text="|$${#numbers.formatDecimal(line.subtotal, 1, 2)}|">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold pt-3 summary-total">
                        <span>Total</span><span th:text="|$${#numbers.formatDecimal(total, 1, 2)}|">$0.00</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
