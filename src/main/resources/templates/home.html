<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ebuy | Everyday finds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/store.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <section class="hero rounded-4 p-4 p-lg-5 mb-5">
        <div class="hero-copy">
            <p class="eyebrow mb-3">A little better, every day</p>
            <h1 class="display-4 fw-bold">Good things<br>for everyday living.</h1>
            <p class="lead">Well-chosen essentials for your home, your work, and everywhere in between.</p>
            <a class="btn btn-dark btn-lg mt-2" th:href="@{/products}">Explore the collection <span aria-hidden="true">→</span></a>
        </div>
        <div class="hero-art" aria-hidden="true">
            <div class="hero-orbit orbit-one"></div>
            <div class="hero-orbit orbit-two"></div>
            <div class="hero-sun"></div>
            <div class="hero-stem"></div>
        </div>
    </section>
    <div class="section-heading mb-4">
        <div>
            <p class="eyebrow mb-2">Selected for you</p>
            <h2 class="h3 mb-0">Shop the favorites</h2>
        </div>
        <a th:href="@{/products}" class="text-link">View the full collection <span aria-hidden="true">→</span></a>
    </div>
    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="product : ${products.content}">
            <article class="card product-card h-100">
                <a th:href="@{/products/{id}(id=${product.id})}" class="product-image">
                    <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
                    <span th:unless="${product.imageUrl}" class="image-placeholder">ebuy</span>
                </a>
                <div class="card-body d-flex flex-column">
                    <div class="product-category" th:text="${product.category.name}">Category</div>
                    <h3 class="h5 mt-2"><a class="text-decoration-none text-dark"
                        th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></h3>
                    <p class="product-description" th:text="${#strings.abbreviate(product.description, 88)}">Product description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="product-price" th:text="|$${#numbers.formatDecimal(product.price, 1, 2)}|">$0.00</span>
                        <span class="stock-label" th:classappend="${product.stockQuantity > 0 ? ' is-in-stock' : ' is-sold-out'}"
                              th:text="${product.stockQuantity > 0 ? 'In stock' : 'Sold out'}">In stock</span>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
